name: AI Guardrail
description: Prioritize and explain static-analysis findings with source context and compliance mapping.
author: Sam Degnan
branding:
  icon: shield
  color: red

inputs:
  report-path:
    description: Path to the static analysis report (SARIF, SonarQube JSON, or cppcheck XML).
    required: true
  format:
    description: Report format. If omitted, auto-detection is attempted.
    required: false
    default: ""
  language:
    description: Source language hint (auto, c, cpp, javascript, typescript, python, ruby, terraform). If omitted or auto, the language is inferred from the report or file extensions.
    required: false
    default: auto
  repo-root:
    description: Root directory containing source files.
    required: false
    default: .
  provider:
    description: LLM provider (openai, anthropic, gemini, mock).
    required: false
    default: mock
  llm-api-key:
    description: API key for the selected LLM provider.
    required: false
  llm-model:
    description: Model name to use with the selected LLM provider.
    required: false
  output-json:
    description: Path where the JSON report should be written.
    required: false
  output-markdown:
    description: Path where the Markdown report should be written.
    required: false
  max-concurrency:
    description: Maximum concurrent LLM requests.
    required: false
    default: "3"
  fail-on-unclear:
    description: Treat UNCLEAR findings as failures.
    required: false
    default: "true"
  fallback-providers:
    description: Comma-separated fallback LLM providers.
    required: false
    default: ""
  cache-backend:
    description: Cache backend (memory or sqlite).
    required: false
    default: "memory"
  cache-sqlite-path:
    description: Path to the SQLite cache database.
    required: false
    default: .guardrail-cache.db
  policy:
    description: Path to an OPA/Rego policy file.
    required: false
    default: ""
  output-sarif:
    description: Path to write a SARIF 2.1.0 report.
    required: false
    default: ""
  pr-comment-mode:
    description: Post high-priority findings as GitHub PR comments (review or commit).
    required: false
    default: ""
  github-token:
    description: GitHub token for PR comments.
    required: false
    default: ""
  pr-number:
    description: Pull request number for PR comments.
    required: false
    default: ""
  repository:
    description: GitHub repository in owner/repo format for PR comments.
    required: false
    default: ""
  commit-sha:
    description: Commit SHA to associate with PR review comments.
    required: false
    default: ""
  semantic-compliance:
    description: Enable RAG-based semantic compliance mapping.
    required: false
    default: "false"
  vector-store-path:
    description: Path to the semantic compliance vector store.
    required: false
    default: .guardrail-vectors.db
  context-strategy:
    description: Context extraction strategy (auto, line-window, ast).
    required: false
    default: auto

runs:
  using: docker
  image: Dockerfile
  args:
    - ${{ inputs.report-path }}
