name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e . bandit[toml]

      - name: Scan repository source with Bandit
        run: |
          mkdir -p docs/_data
          set +e
          bandit -r src -f json -o bandit-report.json
          exit_code=$?
          set -e
          if [ "$exit_code" -gt 1 ]; then
            echo "Bandit failed with unexpected exit code $exit_code" >&2
            exit "$exit_code"
          fi
          test -s bandit-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("bandit-report.json").read_text())
          blocking = [
              result for result in report.get("results", [])
              if result.get("issue_severity", "").upper() in {"HIGH", "MEDIUM"}
          ]
          if blocking:
              for result in blocking:
                  print(
                      f"Blocking Bandit finding: {result.get('test_id')} "
                      f"{result.get('issue_severity')} {result.get('filename')}"
                  )
              raise SystemExit(1)
          print(f"Bandit severity gate passed with {len(report.get('results', []))} low finding(s)")
          PY
          python scripts/bandit_to_sarif.py bandit-report.json bandit-report.sarif
          test -s bandit-report.sarif

      - name: Triage the self-scan with Guardrail
        run: |
          set +e
          guardrail bandit-report.sarif \
            --repo-root . \
            --provider mock \
            --no-fail-on-unclear \
            --output-json docs/_data/guardrail-report.json \
            --output-markdown docs/_data/guardrail-report.md
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 0 ]; then
            echo "Guardrail self-assessment failed with exit code $exit_code" >&2
            exit "$exit_code"
          fi

      - name: Verify and package self-assessment report
        run: |
          test -s bandit-report.sarif
          test -s docs/_data/guardrail-report.json
          test -s docs/_data/guardrail-report.md
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("docs/_data/guardrail-report.json").read_text())
          assert "summary" in data and "results" in data, "Invalid report structure"
          out_of_scope = []
          for result in data["results"]:
              finding = result.get("finding") or result
              path = str(finding.get("file_path") or finding.get("filePath") or "")
              normalized = path.replace(chr(92), "/")
              while normalized.startswith("./"):
                  normalized = normalized[2:]
              segments = normalized.split("/")
              if (
                  not normalized.startswith("src/")
                  or any(segment in {"", ".", "..", "sample_code"} for segment in segments)
              ):
                  out_of_scope.append(path or "<missing path>")
          if out_of_scope:
              raise SystemExit(f"Self-assessment contains out-of-scope findings: {out_of_scope}")
          print(data["summary"])
          PY
          cp bandit-report.sarif docs/_data/bandit-report.sarif

      - name: Upload self-assessment inputs and outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guardrail-self-assessment
          if-no-files-found: error
          path: |
            bandit-report.json
            bandit-report.sarif
            docs/_data/guardrail-report.json
            docs/_data/guardrail-report.md
            docs/_data/bandit-report.sarif

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
