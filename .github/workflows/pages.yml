name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e . bandit[toml]

      - name: Scan repository source with Bandit
        run: |
          mkdir -p docs/_data
          set +e
          bandit -r src -f json -o bandit-report.json
          exit_code=$?
          set -e
          if [ "$exit_code" -gt 1 ]; then
            echo "Bandit failed with unexpected exit code $exit_code" >&2
            exit "$exit_code"
          fi
          test -s bandit-report.json
          python scripts/bandit_to_sarif.py bandit-report.json bandit-report.sarif
          test -s bandit-report.sarif

      - name: Triage the self-scan with Guardrail
        run: |
          set +e
          guardrail bandit-report.sarif \
            --repo-root . \
            --provider mock \
            --output-json docs/_data/guardrail-report.json \
            --output-markdown docs/_data/guardrail-report.md
          exit_code=$?
          set -e
          if [ "$exit_code" -gt 1 ]; then
            echo "Guardrail failed with unexpected exit code $exit_code" >&2
            exit "$exit_code"
          fi

      - name: Verify and package self-assessment report
        run: |
          test -s bandit-report.sarif
          test -s docs/_data/guardrail-report.json
          test -s docs/_data/guardrail-report.md
          python -c "import json; data = json.load(open('docs/_data/guardrail-report.json')); assert 'summary' in data and 'results' in data, 'Invalid report structure'; print(data['summary'])"
          cp bandit-report.sarif docs/_data/bandit-report.sarif

      - name: Upload self-assessment inputs and outputs
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-self-assessment
          if-no-files-found: error
          path: |
            bandit-report.json
            bandit-report.sarif
            docs/_data/guardrail-report.json
            docs/_data/guardrail-report.md
            docs/_data/bandit-report.sarif

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
