name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install guardrail package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate self-assessment report
        # sample.sarif deliberately contains a high-priority finding, so the
        # guardrail exits with code 1. The report is still written before exit.
        # We permit only exit code 1; any other non-zero code means a real bug.
        run: |
          mkdir -p docs/_data

          run_guardrail() {
            guardrail tests/fixtures/sample.sarif \
              --repo-root . \
              --provider mock \
              --output-json docs/_data/guardrail-report.json
          }

          # Intentional high-priority finding yields exit code 1.
          # Exit with any other non-zero code because it indicates a real failure.
          run_guardrail || {
            exit_code=$?
            if [ "$exit_code" -ne 1 ]; then
              echo "guardrail failed with unexpected exit code $exit_code" >&2
              exit "$exit_code"
            fi
          }

      - name: Verify self-assessment report
        run: |
          test -f docs/_data/guardrail-report.json
          python -c "import json; data = json.load(open('docs/_data/guardrail-report.json')); assert 'summary' in data and 'results' in data, 'Invalid report structure'"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
