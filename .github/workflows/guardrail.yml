name: AI Guardrail CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Format check with Ruff
        run: ruff format --check src tests

      - name: Type check with mypy
        run: mypy src tests --ignore-missing-imports

      - name: Run tests with pytest
        run: pytest -v -W error::ResourceWarning

  sast:
    name: Python SAST
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit

      - name: Run Bandit security linter
        # Fail on medium and above severity issues.
        run: bandit -r src -f json -o bandit-report.json -ll

      - name: Run pip-audit dependency check
        run: pip-audit --desc --format=json --output=pip-audit-report.json --requirement=requirements.txt

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ai-cicd-security-guardrail:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run guardrail from image
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            --workdir /workspace \
            --user "$(id -u):$(id -g)" \
            ai-cicd-security-guardrail:latest \
              tests/fixtures/sample.sarif \
              --repo-root /workspace \
              --provider mock \
              --output-json /workspace/report.json

      - name: Verify report was produced
        run: |
          test -f report.json
          python -c "import json; print(json.load(open('report.json'))['findings'])"

  trivy:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image for scan
        run: docker build -t ai-cicd-security-guardrail:trivy .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ai-cicd-security-guardrail:trivy
          format: sarif
          output: trivy-report.sarif

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.sarif

  demo:
    name: Self-Assessment Demo
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run guardrail against itself (mock provider)
        uses: ./
        continue-on-error: true
        with:
          report-path: ./tests/fixtures/sample.sarif
          format: sarif
          provider: mock
          output-json: guardrail-report.json
          output-markdown: guardrail-report.md

      - name: Upload guardrail report
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-report
          path: |
            guardrail-report.json
            guardrail-report.md

      - name: Update security report page
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p docs/_data
          cp guardrail-report.json docs/_data/guardrail-report.json || true
