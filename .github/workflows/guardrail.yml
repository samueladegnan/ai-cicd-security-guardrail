name: AI Guardrail CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Format check with Ruff
        run: ruff format --check src tests

      - name: Type check with mypy
        run: mypy src tests --ignore-missing-imports

      - name: Run tests with pytest
        run: pytest -v -W error::ResourceWarning

  js-renderer:
    name: JS Renderer Package
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "packages/guardrail-report-renderer/package-lock.json"

      - name: Install JS dependencies
        working-directory: packages/guardrail-report-renderer
        run: npm ci

      - name: Run JavaScript dependency audit
        working-directory: packages/guardrail-report-renderer
        run: npm audit --audit-level=high

      - name: Run JS unit tests
        working-directory: packages/guardrail-report-renderer
        run: npm test

      - name: Build docs assets and check for drift
        working-directory: packages/guardrail-report-renderer
        run: |
          npm run build
          if [ -n "$(git status --short ../../docs/assets/js/guardrail-report-renderer.js ../../docs/assets/css/guardrail-report.css)" ]; then
            echo "Generated docs assets are out of sync. Run 'npm run build' in packages/guardrail-report-renderer and commit the changes." >&2
            git status --short ../../docs/assets/js/guardrail-report-renderer.js ../../docs/assets/css/guardrail-report.css >&2
            exit 1
          fi

      - name: Install Playwright browsers
        working-directory: packages/guardrail-report-renderer
        run: npx playwright install --with-deps chromium

      - name: Run browser demo E2E tests
        working-directory: packages/guardrail-report-renderer
        run: |
          trap 'docker compose -f ../../docs/docker-compose.yml down --remove-orphans' EXIT
          docker compose -f ../../docs/docker-compose.yml up --detach --build
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4000/ai-cicd-security-guardrail/demo/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "The docs server did not become ready" >&2
              exit 1
            fi
            sleep 2
          done
          npm run test:e2e -- --workers=1

  sast:
    name: Python SAST
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit

      - name: Run Bandit security linter
        run: |
          set +e
          bandit -r src -f json -o bandit-report.json -ll
          exit_code=$?
          set -e
          if [ "$exit_code" -gt 1 ]; then
            echo "Bandit failed with unexpected exit code $exit_code" >&2
            exit "$exit_code"
          fi
          if [ "$exit_code" -eq 1 ]; then
            echo "Bandit found medium or high severity findings" >&2
            exit 1
          fi

      - name: Run pip-audit dependency check
        run: pip-audit --desc --format=json --output=pip-audit-report.json --requirement=requirements.txt

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          if-no-files-found: error
          path: bandit-report.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pip-audit-report
          if-no-files-found: error
          path: pip-audit-report.json

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ai-cicd-security-guardrail:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run guardrail from image
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            --workdir /workspace \
            --user "$(id -u):$(id -g)" \
            ai-cicd-security-guardrail:latest \
              tests/fixtures/clean.sarif \
              --repo-root /workspace \
              --provider mock \
              --output-json /workspace/report.json

      - name: Verify report was produced
        run: |
          test -f report.json
          python -c "import json; data = json.load(open('report.json')); print(data['summary'], data['results'])"

  trivy:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image for scan
        run: docker build -t ai-cicd-security-guardrail:trivy .

      - name: Generate complete Trivy vulnerability report
        id: trivy-report
        # v0.36.0, pinned to the verified release commit.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_SKIP_VERSION_CHECK: 'true'
        with:
          image-ref: ai-cicd-security-guardrail:trivy
          scanners: vuln,secret
          format: sarif
          output: trivy-report.sarif
          exit-code: '0'

      - name: Fail on fixable HIGH/CRITICAL vulnerabilities
        # Keep unfixed and fix-deferred findings visible in the artifact without
        # blocking the build until a remediation is available.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_SKIP_VERSION_CHECK: 'true'
        with:
          image-ref: ai-cicd-security-guardrail:trivy
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'

      - name: Fail on detected secrets
        if: ${{ always() && steps.trivy-report.outcome == 'success' }}
        # Secret findings are an independent policy gate. They do not have a
        # fixed-version concept, so keep them separate from the vulnerability gate.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_SKIP_VERSION_CHECK: 'true'
        with:
          image-ref: ai-cicd-security-guardrail:trivy
          scanners: secret
          exit-code: '1'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report
          if-no-files-found: error
          path: trivy-report.sarif

  self-assessment:
    name: Guardrail Self-Assessment
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e . bandit[toml]

      - name: Scan repository source with Bandit
        run: |
          set +e
          bandit -r src -f json -o bandit-report.json
          exit_code=$?
          set -e
          if [ "$exit_code" -gt 1 ]; then
            echo "Bandit failed with unexpected exit code $exit_code" >&2
            exit "$exit_code"
          fi
          test -s bandit-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("bandit-report.json").read_text())
          blocking = [
              result for result in report.get("results", [])
              if result.get("issue_severity", "").upper() in {"HIGH", "MEDIUM"}
          ]
          if blocking:
              for result in blocking:
                  print(
                      f"Blocking Bandit finding: {result.get('test_id')} "
                      f"{result.get('issue_severity')} {result.get('filename')}"
                  )
              raise SystemExit(1)
          print(f"Bandit severity gate passed with {len(report.get('results', []))} low finding(s)")
          PY
          python scripts/bandit_to_sarif.py bandit-report.json bandit-report.sarif
          test -s bandit-report.sarif

      - name: Triage self-scan with the local mock provider
        run: |
          set +e
          guardrail bandit-report.sarif \
            --repo-root . \
            --provider mock \
            --no-fail-on-unclear \
            --output-json guardrail-report.json \
            --output-markdown guardrail-report.md
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 0 ]; then
            echo "Guardrail self-assessment failed with exit code $exit_code" >&2
            exit "$exit_code"
          fi

      - name: Verify self-assessment report
        run: |
          test -s bandit-report.sarif
          test -s guardrail-report.json
          test -s guardrail-report.md
          python -c "import json; data = json.load(open('guardrail-report.json')); assert 'summary' in data and 'results' in data, 'Invalid report structure'; print(data['summary'])"

      - name: Upload self-assessment report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guardrail-self-assessment
          if-no-files-found: error
          path: |
            bandit-report.sarif
            guardrail-report.json
            guardrail-report.md

