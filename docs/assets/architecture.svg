<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-label="AI Guardrail high-level data flow">
  <defs>
    <linearGradient id="grad-sast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4ff" />
      <stop offset="100%" stop-color="#d1e9ff" />
    </linearGradient>
    <linearGradient id="grad-process" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f0ff" />
      <stop offset="100%" stop-color="#e5ddff" />
    </linearGradient>
    <linearGradient id="grad-engine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6f0" />
      <stop offset="100%" stop-color="#ffe8db" />
    </linearGradient>
    <linearGradient id="grad-output" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eefcf4" />
      <stop offset="100%" stop-color="#d9f7e6" />
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#5a6270" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="960" height="720" fill="#ffffff" rx="12" />

  <text x="480" y="44" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">AI Guardrail Data Flow</text>
  <text x="480" y="72" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#656d76">From SAST report to triaged CI decision</text>

  <!-- Step 1: SAST Report -->
  <g transform="translate(380, 110)">
    <rect width="200" height="80" rx="12" fill="url(#grad-sast)" stroke="#0969da" stroke-width="2" filter="url(#shadow)" />
    <text x="100" y="36" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">SAST Report</text>
    <text x="100" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#57606a">SARIF · SonarQube · cppcheck</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="480" y1="190" x2="480" y2="220" stroke="#5a6270" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Step 2: Parser -->
  <g transform="translate(380, 230)">
    <rect width="200" height="80" rx="12" fill="#f6f8fa" stroke="#1f883d" stroke-width="2" filter="url(#shadow)" />
    <text x="100" y="36" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Parser Layer</text>
    <text x="100" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#57606a">Normalize into Finding objects</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="480" y1="310" x2="480" y2="340" stroke="#5a6270" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Step 3: Finding Model -->
  <g transform="translate(380, 350)">
    <rect width="200" height="80" rx="12" fill="url(#grad-process)" stroke="#8250df" stroke-width="2" filter="url(#shadow)" />
    <text x="100" y="36" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Finding Model</text>
    <text x="100" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#57606a">rule · location · CWE · language</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="480" y1="430" x2="480" y2="460" stroke="#5a6270" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Step 4: Triage Engine -->
  <g transform="translate(320, 470)">
    <rect width="320" height="120" rx="16" fill="url(#grad-engine)" stroke="#cf222e" stroke-width="2" filter="url(#shadow)" />
    <text x="160" y="32" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2328">Triage Engine</text>

    <g transform="translate(28, 52)">
      <rect width="86" height="48" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" />
      <text x="43" y="24" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328">Context</text>
      <text x="43" y="39" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#57606a">Extractor</text>
    </g>

    <g transform="translate(117, 52)">
      <rect width="86" height="48" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" />
      <text x="43" y="24" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328">Compliance</text>
      <text x="43" y="39" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#57606a">Mapper</text>
    </g>

    <g transform="translate(206, 52)">
      <rect width="86" height="48" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" />
      <text x="43" y="24" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328">LLM</text>
      <text x="43" y="39" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#57606a">Client</text>
    </g>
  </g>

  <!-- Arrow 4 -->
  <line x1="480" y1="590" x2="480" y2="630" stroke="#5a6270" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Step 5: Report + Exit Code -->
  <g transform="translate(320, 630)">
    <rect width="320" height="60" rx="12" fill="url(#grad-output)" stroke="#1f883d" stroke-width="2" filter="url(#shadow)" />
    <text x="160" y="28" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Report + CI Exit Code</text>
    <text x="160" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#57606a">JSON · Markdown · pass / fail</text>
  </g>

  <!-- Side labels -->
  <text x="120" y="615" font-family="Inter, Arial, sans-serif" font-size="12" fill="#57606a" text-anchor="start">Enrich: source context, compliance controls, LLM classification</text>
  <text x="840" y="615" font-family="Inter, Arial, sans-serif" font-size="12" fill="#57606a" text-anchor="end">Classify: high-priority risk, false positive, or unclear</text>
</svg>
