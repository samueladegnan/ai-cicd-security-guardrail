[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cicd-security-guardrail"
dynamic = ["version"]
description = "AI-Driven CI/CD Guardrail for context-aware secure code reviews across languages."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sam Degnan", email = "samueladegnan@gmail.com"}
]
keywords = ["security", "cicd", "static-analysis", "llm", "compliance", "c", "cpp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
ast = [
    "tree-sitter>=0.20.0",
    "tree-sitter-language-pack>=0.1.0",
]
rag = [
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "responses>=0.24.0",
    "mypy>=1.7.0",
    "ruff>=0.6.0",
    "types-requests>=2.31.0",
]

[project.scripts]
guardrail = "guardrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/guardrail/_version.py"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["venv", "build", "docs", "src/guardrail/_version.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/guardrail/_version.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=guardrail --cov-report=term-missing --cov-report=xml"